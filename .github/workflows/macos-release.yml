# Build beside GitHub storage to avoid transferring large offline bundles locally.
name: macOS release upload
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release matching this commit
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: macos-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13.11'
      - name: Require the matching draft before building
        run: |
          test "$(uname -m)" = arm64
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check --exclude src/raspi_player/payload
      - run: uv run ty check --python-platform linux src/raspi_player/payload
      - run: uv run pytest
      - run: uv run raspi-player prepare-offline
      - run: uv run python scripts/build_app.py
      - name: Verify and upload the macOS download
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          disk_image="Raspi-Player-$version-macos-arm64.dmg"
          (cd dist && shasum -a 256 -c "$disk_image.sha256")
          'dist/Raspi Player.app/Contents/MacOS/Raspi Player' --help
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          gh release upload "$RELEASE_TAG" "dist/$disk_image" "dist/$disk_image.sha256" --clobber
