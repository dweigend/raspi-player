# Package native offline apps; operator videos are never included.
name: Offline bundles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run raspi-player prepare-offline
      - run: uv run python scripts/build_app.py
      - name: Archive macOS bundle preserving application symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist raspi-player-macos.zip
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        run: Compress-Archive -Path 'dist/Raspi Player' -DestinationPath raspi-player-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: raspi-player-${{ matrix.os }}
          path: raspi-player-*.zip
          compression-level: 0
          retention-days: 14
