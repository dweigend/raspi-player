# Test boundaries on each supported host; no physical device writes.
name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check --exclude src/raspi_player/payload
      - run: uv run ty check --python-platform linux src/raspi_player/payload
      - run: uv run pytest
      - run: uv build
